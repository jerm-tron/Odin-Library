<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
    <title>Library</title>
  </head>
  <body>
    <header>Library</header>
    <dialog class="modal">
      <h2>Enter a book</h2>
      <form action="put" id="new-book-form" method="dialog">
        <label for="title">Title:</label>
        <input type="text" class="title" id="title" /><br />
        <label for="author">Author:</label
        ><input type="text" class="author" id="author" /><br />
        <label for="pages">Pages:</label
        ><input type="number" class="pages" id="pages" /><br />
        <div class="reading">
          <button class="submit-bttn" type="submit" form="form">Add</button>
          <button class="close">Close</button>
        </div>
      </form>
    </dialog>
    <main>
      <button class="add-books">New Book</button>
      <div class="library-display">
        <div class="book-card">
          <div class="title-div">
            <div>Title:</div>
            <div class="title-text"></div>
          </div>
          <div class="author-div">
            <div>Author:</div>
            <div class="author-text"></div>
          </div>
          <div class="pages-div">
            <div>Pages:</div>
            <pages class="pages-text"></pages>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
